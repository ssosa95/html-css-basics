<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- This single line is what tells the browser "actually render at the device's real width." -->
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="site-header">
        <h1>Contact Form</h1>       
    </header>
    <main>
    <form>
        <section>
            <div class="form-row">
                <div class="form-field">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="name@domain.com">
                </div>
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" placeholder="General Inquiry/Feedback/Support">
                </div>
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Enter your message..."></textarea>
                </div>
            </div> 
            <button type="submit" class="button">Send</button>
            
        
        </section>
    </form>
    </main>
</body>
</html>
